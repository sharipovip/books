name: 🇹🇯 President news archive

# Ежечасно архивирует новости сомонаи prezident.tj (8 категорий):
# president/<категория>/<id>.json — полный архив (текст + фото),
# president/index.json — резервный список для приложения.
# Коммит создаётся ТОЛЬКО если есть новые новости.

on:
  schedule:
    - cron: '17 * * * *'   # каждый час (17-я минута, чтобы не в пиковое время)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: president-news
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Скачать новости prezident.tj
        run: python3 president_news.py

      - name: 💾 Commit (только если есть новые новости)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add president/
          if git diff --cached --quiet; then
            echo "✓ Новых новостей нет"
          else
            git commit -m "🤖 auto: архив хабарҳои prezident.tj ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
            echo "✅ Архив обновлён"
          fi
