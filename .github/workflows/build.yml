name: 🛠 Build manifests, books.json and covers

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - 'covers/**'
      - 'build.py'
      - 'generate_covers_manifest.py'
      - 'generate_search_index.py'
      - 'cover_source_hashes.json'
      - 'display_names.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-books-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils antiword
          python -m pip install --upgrade pip
          pip install --quiet pillow

      # v99: .doc-книги получают .docx-копию для показа ВНУТРИ приложения.
      # LibreOffice тяжёлый — ставим ТОЛЬКО если есть .doc без .docx-копии
      # (обычно один раз после загрузки новых .doc, потом копии уже в репо).
      - name: 📄 LibreOffice для конвертации .doc (если нужно)
        run: |
          if python3 -c "import pathlib,sys; sys.exit(0 if [p for p in pathlib.Path('books').rglob('*.doc') if not p.with_suffix('.docx').exists()] else 1)"; then
            echo "Найдены .doc без .docx-копии — устанавливаю LibreOffice (1-2 мин, один раз)"
            sudo apt-get install -y --no-install-recommends libreoffice-writer
          else
            echo "Новых .doc нет — LibreOffice не нужен"
          fi

      - name: 🔨 Run build.py
        run: python3 build.py

      - name: 🖼 Generate covers manifest
        run: python3 generate_covers_manifest.py

      - name: 🔎 Generate global search index
        run: python3 generate_search_index.py

      - name: 💾 Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✓ No changes to commit"
          else
            git commit -m "🤖 auto: rebuild manifests + books.json + covers + indexes"
            git push
            echo "✅ Pushed changes"
          fi
